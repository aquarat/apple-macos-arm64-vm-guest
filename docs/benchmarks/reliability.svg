<text x="22.0" y="38.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">GPU stability under sustained iOS simulator load</text>
<text x="22.0" y="57.0" font-size="12.5" fill="#52514e" text-anchor="start">Each row counts sustained runs on a macOS 26 guest: a UI test, then repeated test reruns.</text>
<text x="22.0" y="76.0" font-size="12.5" fill="#52514e" text-anchor="start">Clean = no guest panic and no host GPU hang. The three worker rows overlap: the candidate's</text>
<text x="22.0" y="95.0" font-size="12.5" fill="#52514e" text-anchor="start">runs are part of the round-robin series, which is part of the stamp-fix series.</text>
