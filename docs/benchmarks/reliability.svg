<title>GPU stability under sustained iOS simulator load</title>
<desc>Clean runs per build: Before IOSurface ring fix: 1/8 clean · 7 guest losses or panics; IOSurface ring fix: 6/6 clean; Compute samples draw residents: 3/3 clean; Worker prototype, before stamp fix: 4/6 clean · 2 host GPU hangs; Main loop + stamp fix: 4/4 clean; Worker runs since stamp fix (all): 14/15 clean · 1 guest panic (early); Worker runs since round-robin: 12/12 clean; Main loop + compaction (fallback): 3/3 clean; 2026-10-10 build, sustained stress: 5/5 clean; Copy path: 3/3 clean; Copy path + follow-ups: 2/2 clean; Out of process, final candidate: 3/3 clean</desc>
