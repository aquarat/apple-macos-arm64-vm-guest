<svg xmlns="http://www.w3.org/2000/svg" width="780" height="516" viewBox="0 0 780 516" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>macOS 26 boot reliability</title>
<desc>Boot failure rates: PL031 clock only (boot_stall): 6/40 (15.0 %); avp,rtc clock, image without RTC offset (boot_stall): 5/60 (8.3 %); avp,rtc clock, re-baked image (v7) (boot_stall): 5/110 (4.5 %); v7 image, M1 Ultra host (boot_stall): 0/30 (0.0 %); 8 vCPU / 12 GiB, QEMU 8cce779f63 (boot_stall): 17/203 (8.4 %); same, with the used-ring fix (boot_stall): 0/200 (0.0 %); 8 vCPU / 12 GiB, QEMU 8cce779f63 (sound_missing): 8/186 (4.3 %); same, with the used-ring fix (sound_missing): 0/200 (0.0 %)</desc>
<rect x="0.5" y="0.5" width="779" height="515" rx="10" fill="#fcfcfb" stroke="#dddcd5"/>
<text x="22.0" y="38.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">macOS 26 boot reliability</text>
<text x="22.0" y="57.0" font-size="12.5" fill="#52514e" text-anchor="start">Tahoe guests booted repeatedly with retries off. Both faults were one macOS virtio</text>
<text x="22.0" y="76.0" font-size="12.5" fill="#52514e" text-anchor="start">driver bug: a used ring placed inside the available ring. QEMU now relocates it.</text>
<text x="22.0" y="100.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Boots that never reached SSH</text>
